# one command: docker compose up -d
# the data volume holds data/oldie.sqlite — settings, articles, counters and
# messages all live in that one file. config and content only matter on a first
# boot: the bootstrap config, and any .md files to import.
services:
  blog:
    build: .
    image: oldie-blog:latest
    container_name: oldie-blog
    restart: unless-stopped
    ports:
      - '4173:4173'
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL:-http://localhost:4173}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes:
      - content:/app/content
      - data:/app/data
      - config:/app/config

volumes:
  content:
  data:
  config:
